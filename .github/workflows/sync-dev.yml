name: Deploy main to dev

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: sync-dev
  cancel-in-progress: false

jobs:
  sync-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward dev to the production commit
        run: git push origin "${{ github.sha }}:refs/heads/dev"
