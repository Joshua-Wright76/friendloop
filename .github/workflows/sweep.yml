name: Sweep

# The fallback trigger. A Vercel Schedule (vercel.json) calls the sweep every 15
# minutes; Schedules are in beta and stop for the month past the Hobby run limit.
#
# GitHub schedules are best-effort, and this one has been seen running about four
# times a day rather than every 15 minutes, so it is not enough on its own. The
# sweep reconciles state at whatever instant it is called and its advisory lock
# makes an overlap a no-op, so running both is harmless. GitHub also disables
# schedules in a public repo after 60 days with no commits; re-enable from the
# Actions tab if that ever happens.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: sweep
  cancel-in-progress: false

permissions: {}

jobs:
  sweep:
    name: Sweep production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/sweep
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SWEEP_URL: https://friendloop.dev/api/cron/sweep
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in repository secrets"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SWEEP_URL"
          echo
