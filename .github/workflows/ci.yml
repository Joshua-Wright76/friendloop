name: CI

# The gate README claims exists: typecheck, lint, unit tests, the flow matrix,
# and the full Playwright suite — on every PR and on every push to main.
#
# Vercel deploys `main` independently of this workflow, so a push that breaks
# the suite is still deployed; this run is what tells you. Blocking the deploy
# itself would need PRs plus branch protection, which this repo does not use.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pinned, not ubuntu-latest: that label migrated to Ubuntu 26 on 2026-10-19.
# A gate should not change distro underneath us — Playwright's --with-deps and
# the runner image move at different speeds. Bump deliberately, not by drift.
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    services:
      # The database-backed unit tests need a Postgres of their own; the e2e job
      # gets a separate one so the two never see each other's rows.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: friendloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/friendloop_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # typegen first: LayoutProps/PageProps live in .next/types and are
      # otherwise only produced by a full build, so a bare clone fails
      # typecheck without it. `npm run verify` now does this itself.
      - name: Verify (typegen, typecheck, lint, unit, integration, flows, tables, migrations)
        run: npm run verify

      # 100% line and function coverage of src/lib, enforced rather than reported.
      - name: Coverage gate
        run: npm run test:coverage

      # The release gate README promises: no flow may ship marked `todo`.
      - name: Flow coverage (strict)
        run: npm run check:flows -- --strict

  # The suite runs one test at a time (every test truncates the same database),
  # so one runner took ~28 minutes. Shards each get their own runner and their
  # own Postgres, and none of them wait for `verify`: the two gates are
  # independent. Playwright shards by test count in file order, and the WCAG
  # sweeps (1.5-2.5 min each, ~19 min together) sort last — at four shards they
  # all landed in one. So they are their own group,
  # sharded four ways beside the other four; `--grep`/`--grep-invert` on the
  # shared title prefix makes the two groups exact complements.
  e2e-shard:
    name: End-to-end (${{ matrix.group }} ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [flows, wcag]
        shard: [1, 2, 3, 4]
    services:
      # Deterministic and separate from any dev database. When
      # TEST_DATABASE_URL is set, scripts/e2e-db.mjs stands down and uses this.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: friendloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/friendloop_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The `phone` project runs iPhone 13, which is WebKit — chromium alone
      # is not enough.
      # The browser downloads are cached by Playwright version; the system
      # packages they need still come from apt every run.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # Next.js build cache: the suite boots a production build, and every
      # shard builds the same tree.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Run the suite (${{ matrix.group }}, shard ${{ matrix.shard }} of 4)
        env:
          GREP_FLAG: ${{ matrix.group == 'wcag' && '--grep' || '--grep-invert' }}
        run: npm run e2e -- "$GREP_FLAG" "WCAG AA" --shard=${{ matrix.shard }}/4

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.group }}-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # One stable check name for branch protection, whatever the shard count.
  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    needs: e2e-shard
    if: always()
    steps:
      - name: All shards passed
        run: |
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            echo "::error::An end-to-end shard did not pass (${{ needs.e2e-shard.result }})"
            exit 1
          fi
