name: CI

# The gate README claims exists: typecheck, lint, unit tests, the flow matrix,
# and the full Playwright suite — on every PR and on every push to main.
#
# Vercel deploys `main` independently of this workflow, so a push that breaks
# the suite is still deployed; this run is what tells you. Blocking the deploy
# itself would need PRs plus branch protection, which this repo does not use.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pinned, not ubuntu-latest: that label migrated to Ubuntu 26 on 2026-10-19.
# A gate should not change distro underneath us — Playwright's --with-deps and
# the runner image move at different speeds. Bump deliberately, not by drift.
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # The database-backed unit tests need a Postgres of their own; the e2e job
      # gets a separate one so the two never see each other's rows.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: friendloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/friendloop_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Everything in `npm run verify` except the tests, which the coverage gate
      # runs next. Running them in both steps took about two extra minutes.
      - name: Static checks (typegen, typecheck, lint, flows, tables, migrations)
        run: npm run verify:checks

      # All unit and integration tests, with 100% line and function coverage of
      # src/lib enforced rather than reported.
      - name: Unit and integration tests, with the coverage gate
        run: TEST_WORKERS=2 npm run test:coverage

      # The release gate README promises: no flow may ship marked `todo`.
      - name: Flow coverage (strict)
        run: npm run check:flows -- --strict

  # Build once from this exact commit while Verify runs independently. The
  # database is migrated first because Next prerenders routes during the build.
  e2e-build:
    name: Build shared end-to-end output
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: friendloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/friendloop_test
      # NEXT_PUBLIC_APP_URL is baked into the shared artifact; shards use these too.
      E2E_PORT: "3100"
      E2E_FAKE_MAIL_PORT: "3102"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the production output
        run: npm run e2e:build

      # Runtime output only. In particular, do not share the compiler cache or
      # any development-server state with the shards.
      - name: Upload the shared production output
        uses: actions/upload-artifact@v7
        with:
          name: e2e-build-${{ github.sha }}
          path: |
            .next/
            !.next/cache/
            !.next/dev/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  # The suite runs one test at a time (every test truncates the same database),
  # so one runner took ~28 minutes. Shards each get their own runner and their
  # own Postgres, and none of them wait for `verify`: the two gates are
  # independent. Playwright shards by test count, not duration, so slow tests
  # that sit together in file order all land in one shard. Hence three groups,
  # each sharded on its own: the flows, the WCAG checks, and the seven stationery
  # sweeps (about 1.5 min each), which alone made one shard take 11 minutes. The
  # greps on the shared title prefixes make the groups exact complements. Each job
  # runs two workers, each with its own database and server (e2e/support/parallel.ts),
  # which suits the runners' four cores; scripts/e2e-db.mjs sets that from CI.
  e2e-shard:
    name: End-to-end (${{ matrix.group }} ${{ matrix.shard }}/${{ matrix.of }})
    needs: e2e-build
    runs-on: ubuntu-24.04
    # A stalled download should fail the job, not hold it for an hour.
    timeout-minutes: 30
    # Browsers and their system packages come with the image. Installing them
    # from apt took 30-60s per job and once stalled for 53 minutes. Keep this
    # tag on the lockfile's Playwright version; a step below enforces it.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { group: flows, shard: 1, of: 3 }
          - { group: flows, shard: 2, of: 3 }
          - { group: flows, shard: 3, of: 3 }
          - { group: wcag, shard: 1, of: 5 }
          - { group: wcag, shard: 2, of: 5 }
          - { group: wcag, shard: 3, of: 5 }
          - { group: wcag, shard: 4, of: 5 }
          - { group: wcag, shard: 5, of: 5 }
          - { group: stationery, shard: 1, of: 2 }
          - { group: stationery, shard: 2, of: 2 }
    services:
      # Deterministic and separate from any dev database. When
      # TEST_DATABASE_URL is set, scripts/e2e-db.mjs stands down and uses this.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: friendloop_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Inside a job container, a service is reached by its name.
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/friendloop_test
      # That Postgres lasts one job, so it needn't flush every commit to disk.
      E2E_RELAX_DB: server
      # Every shard serves the artifact built from this commit, never a rebuild.
      E2E_SKIP_BUILD: "1"
      # Match the URL baked by e2e-build; two app workers use 3100 and 3101.
      E2E_PORT: "3100"
      E2E_FAKE_MAIL_PORT: "3102"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the shared production output
        uses: actions/download-artifact@v7
        with:
          name: e2e-build-${{ github.sha }}
          path: .next

      - name: Check the image matches the lockfile's Playwright
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          if ! grep -q "mcr.microsoft.com/playwright:v$version-" .github/workflows/ci.yml; then
            echo "::error::Update the Playwright image in ci.yml to v$version"
            exit 1
          fi

      # No Next.js build cache is restored. An old cache left a build missing new
      # CSS (PR #35); this artifact is instead built once from the exact commit.
      - name: Run the suite (${{ matrix.group }}, shard ${{ matrix.shard }} of ${{ matrix.of }})
        env:
          GROUP: ${{ matrix.group }}
          SHARD: ${{ matrix.shard }}/${{ matrix.of }}
        run: |
          case "$GROUP" in
            flows) npm run e2e -- --grep-invert "WCAG AA" --shard="$SHARD" ;;
            wcag) npm run e2e -- --grep "WCAG AA" --grep-invert "WCAG AA sweep · stationery" --shard="$SHARD" ;;
            stationery) npm run e2e -- --grep "WCAG AA sweep · stationery" --shard="$SHARD" ;;
            *) echo "::error::Unknown group $GROUP"; exit 1 ;;
          esac

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.group }}-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # One stable check name for branch protection, whatever the shard count.
  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: e2e-shard
    if: always()
    steps:
      - name: All shards passed
        run: |
          if [ "${{ needs.e2e-shard.result }}" != "success" ]; then
            echo "::error::An end-to-end shard did not pass (${{ needs.e2e-shard.result }})"
            exit 1
          fi
